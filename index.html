*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;overflow-x:hidden}
body{font-family:"PingFang SC","Microsoft YaHei","WenQuanYi Micro Hei",sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);padding:12px;min-height:100vh;-webkit-text-size-adjust:100%}
.container{max-width:1400px;margin:0 auto;background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,0.2);overflow:hidden}
.header{background:linear-gradient(135deg,#296BEF 0%,#1e4db8 100%);color:#fff;padding:28px 20px;text-align:center}
.header h1{font-size:22px;margin-bottom:8px;font-weight:600;line-height:1.35}
.header p{font-size:13px;opacity:0.9}
.update-badge{display:inline-block;margin-top:8px;padding:4px 12px;background:rgba(255,255,255,0.2);border-radius:20px;font-size:12px}
.swipe-tip{margin:10px auto 0;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 14px;background:rgba(255,255,255,0.14);border:1px dashed rgba(255,255,255,0.45);border-radius:22px;font-size:12px;color:#fff;max-width:92%;line-height:1.4}
.swipe-tip .arrow{display:inline-block;font-size:14px;animation:swipeMove 1.4s ease-in-out infinite}
.swipe-tip .arrow.left{animation-delay:0.7s;animation-name:swipeMoveLeft}
.swipe-tip .hand{font-size:15px}
@keyframes swipeMove{0%,100%{transform:translateX(0);opacity:0.55}50%{transform:translateX(4px);opacity:1}}
@keyframes swipeMoveLeft{0%,100%{transform:translateX(0);opacity:0.55}50%{transform:translateX(-4px);opacity:1}}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px 14px;background:#f8f9fa}
.summary-card{background:#fff;padding:14px 8px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,0.06);text-align:center}
.summary-card .value{font-size:18px;font-weight:700;color:#296BEF;margin:6px 0;word-break:break-all}
.summary-card .label{font-size:12px;color:#666}
.content{padding:14px}
.category-section{margin-bottom:18px;border:1px solid #e8e8e8;border-radius:10px;overflow:hidden}
.category-header{background:linear-gradient(135deg,#3E79F0 0%,#296BEF 100%);color:#fff;padding:14px 16px;font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
.category-header .name{flex:1}
.growth-tag{padding:4px 10px;border-radius:16px;font-size:12px;font-weight:600;white-space:nowrap;margin-left:8px;color:#fff}
.toggle-arrow{margin-left:10px;font-size:12px;transition:transform 0.3s;opacity:0.9}
.category-header.collapsed .toggle-arrow{transform:rotate(-90deg)}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.category-body{max-height:4000px;transition:max-height 0.35s ease;overflow:hidden}
.category-body.hide{max-height:0}
table{width:100%;border-collapse:collapse;min-width:780px}
th{background:#f8f9fa;color:#333;padding:10px 6px;text-align:center;font-weight:600;border-bottom:2px solid #296BEF;font-size:12px;white-space:nowrap}
th:first-child{text-align:left;padding-left:12px}
td{padding:9px 6px;border-bottom:1px solid #e8e8e8;font-size:12px;text-align:center;white-space:nowrap}
td:first-child{text-align:left;padding-left:12px}
.overall-row{background:#fff9e6!important;font-weight:600}
.overall-row td{border-top:2px solid #FFAE19;border-bottom:2px solid #FFAE19}
.metric-good{color:#76C84D;font-weight:600}
.metric-bad{color:#F76852;font-weight:600}
.recommend-tag{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:8px;font-size:11px;font-weight:600;color:#fff;background:linear-gradient(135deg,#FF6B6B 0%,#EE4D4D 100%);vertical-align:middle;white-space:nowrap}
.footer{background:#f8f9fa;padding:16px 12px;text-align:center;color:#666;font-size:12px}
.footer p{line-height:1.6}
.footer a{color:#8A2BE2;text-decoration:none}
.loading,.empty,.error{padding:60px 20px;text-align:center;color:#666;font-size:14px}
.loading .spinner{display:inline-block;width:30px;height:30px;border:3px solid #e8e8e8;border-top-color:#296BEF;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:14px}
@keyframes spin{to{transform:rotate(360deg)}}
.error{color:#F76852}
.empty{color:#999}
.snap-btn{position:fixed;right:18px;bottom:22px;z-index:9999;background:linear-gradient(135deg,#296BEF 0%,#1e4db8 100%);color:#fff;border:none;border-radius:30px;padding:12px 18px;font-size:14px;font-weight:600;box-shadow:0 6px 18px rgba(41,107,239,0.45);cursor:pointer;display:flex;align-items:center;gap:6px;transition:transform 0.2s,box-shadow 0.2s;font-family:inherit}
.snap-btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(41,107,239,0.55)}
.snap-btn:active{transform:translateY(0)}
.snap-btn:disabled{opacity:0.7;cursor:not-allowed;transform:none}
.snap-btn .icon{font-size:16px}
.snap-mask{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:10000;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;flex-direction:column;gap:14px}
.snap-mask .spinner{width:38px;height:38px;border:3px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite}
@media(max-width:600px){.snap-btn{right:12px;bottom:16px;padding:10px 14px;font-size:13px}}

<script>
function el(id) { return document.getElementById(id); }
function setText(id, text) { const node = el(id); if (node) node.textContent = text || ''; }
function showEmpty() { el('content').innerHTML = '<div class="empty">📭 暂无数据</div>'; }

// 解析金额："¥123.4" / "¥385.0~¥450.0" / "—" -> Number 或 NaN
function parseMoney(v){
  if (v == null) return NaN;
  var s = String(v).replace(/[¥,\s]/g, '').trim();
  if (!s || s === '—' || s === '-' || s === '/') return NaN;
  var first = s.split('~')[0];
  var n = parseFloat(first);
  return isFinite(n) ? n : NaN;
}
// 解析百分数："1.5%" -> 1.5
function parsePct(v){
  if (v == null) return NaN;
  var s = String(v).replace(/[%\s]/g, '').trim();
  if (!s || s === '—' || s === '-') return NaN;
  var first = s.split('~')[0];
  var n = parseFloat(first);
  return isFinite(n) ? n : NaN;
}
// 判断成本字段是否"无数据"
function isEmptyCost(v){
  if (v == null) return true;
  var s = String(v).trim();
  return !s || s === '—' || s === '-';
}

// ---- 强制推荐位白名单（无论数据如何，命中必显示"推荐🔥"）----
var FORCE_RECOMMEND = [
  { cat: '吊牌项链',   pos: '微信视频号' },
  { cat: '吊牌项链',   pos: '微信朋友圈' },
  { cat: '3D真人手办', pos: '微信视频号' },
  { cat: '投影项链',   pos: '微信视频号' }
];
function stripCatPrefix(name){
  return String(name||'').replace(/^\s*\d+\.\s*/, '').trim();
}
function isForceRecommend(catName, posName){
  var c = stripCatPrefix(catName);
  var p = String(posName||'').trim();
  for (var i=0;i<FORCE_RECOMMEND.length;i++){
    if (c.indexOf(FORCE_RECOMMEND[i].cat) >= 0 && p === FORCE_RECOMMEND[i].pos) return true;
  }
  return false;
}

function renderSummary(summary) {
  if (!Array.isArray(summary) || summary.length === 0) { el('summary').innerHTML = ''; return; }
  el('summary').innerHTML = summary.map(function(item){
    return '<div class="summary-card"><div class="label">' + (item.label||'') + '</div><div class="value">' + (item.value||'—') + '</div></div>';
  }).join('');
}

function renderCategory(cat, idx) {
  var rows = Array.isArray(cat.rows) ? cat.rows : [];
  // 需求2：过滤"加企微成本"和"下单成本"都没数据的版位
  rows = rows.filter(function(r){ return !(isEmptyCost(r.wxCost) && isEmptyCost(r.orderCost)); });

  // 需求4：本品类的下单成本平均值（只统计有数字的）
  var costNums = rows.map(function(r){ return parseMoney(r.orderCost); }).filter(function(n){ return !isNaN(n); });
  var avgCost = costNums.length > 0 ? (costNums.reduce(function(a,b){ return a+b; }, 0) / costNums.length) : NaN;

  var rowsHtml = rows.map(function(row, rIdx){
    var alpha = Math.max(0.3, 1 - rIdx * 0.1);
    var ctrClass = row.ctrGood ? 'metric-good' : '';
    // 需求3：下单率优秀（>=1.0% 或 cvrGood/orderGood）标绿
    var orderNum = parsePct(row.order);
    var orderGood = row.orderGood === true || row.cvrGood === true || (!isNaN(orderNum) && orderNum >= 1.0);
    var orderClass = orderGood ? 'metric-good' : '';

    // 需求4：低于品类平均下单成本 OR 命中强制推荐白名单 → 推荐🔥
    var myCost = parseMoney(row.orderCost);
    var isBelowAvg = !isNaN(avgCost) && !isNaN(myCost) && myCost < avgCost;
    var isForce = isForceRecommend(cat.name, row.pos);
    var isRecommend = isBelowAvg || isForce;
    var posHtml = (row.pos||'—') + (isRecommend ? '<span class="recommend-tag">推荐🔥</span>' : '');

    return '<tr style="background:rgba(232,240,254,'+alpha+')">'
      + '<td>' + posHtml + '</td>'
      + '<td class="'+ctrClass+'">' + (row.ctr||'—') + '</td>'
      + '<td class="'+orderClass+'">' + (row.order||'—') + '</td>'
      + '<td>' + (row.wxCost||'—') + '</td>'
      + '<td>' + (row.orderCost||'—') + '</td>'
      + '</tr>';
  }).join('');

  var ov = cat.overall || {};
  var overallHtml = '<tr class="overall-row">'
    + '<td><strong>整体</strong></td>'
    + '<td><strong>' + (ov.ctr||'—') + '</strong></td>'
    + '<td><strong>' + (ov.order||'—') + '</strong></td>'
    + '<td><strong>' + (ov.wxCost||'—') + '</strong></td>'
    + '<td><strong>' + (ov.orderCost||'—') + '</strong></td>'
    + '</tr>';

  var tag = cat.tag || cat.growth || '';
  var tagColor = cat.tagColor || cat.growthColor || '#999';

  return '<div class="category-section">'
    + '<div class="category-header" data-idx="'+idx+'">'
    +   '<span class="name">' + (cat.name||'') + '</span>'
    +   (tag ? '<span class="growth-tag" style="background:'+tagColor+'">'+tag+'</span>' : '')
    +   '<span class="toggle-arrow">▼</span>'
    + '</div>'
    + '<div class="category-body"><div class="table-wrap"><table>'
    +   '<thead><tr>'
    +     '<th style="width:28%">流量版位</th><th style="width:14%">CTR</th>'
    +     '<th style="width:14%">下单率</th><th style="width:22%">加企微成本</th><th style="width:22%">下单成本</th>'
    +   '</tr></thead>'
    +   '<tbody>' + rowsHtml + overallHtml + '</tbody>'
    + '</table></div></div></div>';
}

function renderTotal(t) {
  if (!t) return '';
  return '<div class="category-section" style="border:2px solid #FFAE19">'
    + '<div class="category-header" style="background:linear-gradient(135deg,#FFAE19 0%,#ff8c00 100%)" data-idx="total">'
    +   '<span class="name">全品类汇总</span><span class="toggle-arrow">▼</span>'
    + '</div>'
    + '<div class="category-body"><div class="table-wrap"><table><tbody><tr class="overall-row">'
    +   '<td style="width:28%"><strong>' + (t.name||'全部品类') + '</strong></td>'
    +   '<td style="width:14%"><strong>' + (t.ctr||'—') + '</strong></td>'
    +   '<td style="width:14%"><strong>' + (t.order||'—') + '</strong></td>'
    +   '<td style="width:22%"><strong>' + (t.wxCost||'—') + '</strong></td>'
    +   '<td style="width:22%"><strong>' + (t.orderCost||'—') + '</strong></td>'
    + '</tr></tbody></table></div></div></div>';
}

function bindToggle() {
  el('content').addEventListener('click', function(e){
    var header = e.target.closest('.category-header');
    if (!header) return;
    var body = header.nextElementSibling;
    if (!body) return;
    header.classList.toggle('collapsed');
    body.classList.toggle('hide');
  });
}

function renderPayload(payload, meta) {
  meta = meta || {};
  setText('reportTitle', payload.title || '礼品定制大盘数据');
  setText('reportSubtitle', payload.subtitle || ('数据日期: ' + (payload.reportDate||'-')));

  var updatedAt = meta.updatedAt || payload.reportDate || '';
  if (updatedAt) {
    var badge = el('updateBadge');
    badge.textContent = '📅 更新于 ' + updatedAt;
    badge.style.display = 'inline-block';
  }
  setText('footerInfo', '数据来源: 腾讯广告数仓 | 报告生成时间: ' + (updatedAt || payload.reportDate || '-'));

  renderSummary(payload.summary);
  var categories = Array.isArray(payload.categories) ? payload.categories : [];
  var html = categories.map(function(c,i){return renderCategory(c,i);}).join('') + renderTotal(payload.totalOverall);
  if (!html) { showEmpty(); return; }
  el('content').innerHTML = html;
  bindToggle();
}

function boot() {
  if (window.__REPORT_DATA__ && typeof window.__REPORT_DATA__ === 'object') {
    try {
      renderPayload(window.__REPORT_DATA__, { updatedAt: window.__REPORT_UPDATED_AT__ || window.__REPORT_DATA__.reportDate });
      return;
    } catch (e) { console.error('渲染失败：', e); }
  }
  showEmpty();
}

document.addEventListener('DOMContentLoaded', boot);
</script>

<!-- ========== 一键保存长图 ========== -->
<script>
(function(){
  var btn = document.getElementById('snapBtn');
  if (!btn) return;

  function showMask(text){
    var mask = document.getElementById('snapMask');
    if (!mask){
      mask = document.createElement('div');
      mask.id = 'snapMask';
      mask.className = 'snap-mask';
      mask.innerHTML = '<div class="spinner"></div><div id="snapMaskText"></div>';
      document.body.appendChild(mask);
    }
    document.getElementById('snapMaskText').textContent = text || '生成中...';
    mask.style.display = 'flex';
  }
  function hideMask(){
    var mask = document.getElementById('snapMask');
    if (mask) mask.style.display = 'none';
  }

  btn.addEventListener('click', async function(){
    if (typeof html2canvas === 'undefined'){
      alert('截图组件加载失败，请检查网络后刷新重试');
      return;
    }
    document.querySelectorAll('.category-header.collapsed').forEach(function(h){
      h.classList.remove('collapsed');
      var body = h.nextElementSibling;
      if (body) body.classList.remove('hide');
    });

    btn.disabled = true;
    showMask('正在生成长图，请稍候...');
    await new Promise(function(r){ setTimeout(r, 400); });

    try {
      var target = document.querySelector('.container');
      var canvas = await html2canvas(target, {
        backgroundColor: '#ffffff',
        scale: Math.min(window.devicePixelRatio || 2, 2),
        useCORS: true,
        allowTaint: false,
        logging: false,
        windowWidth: target.scrollWidth,
        windowHeight: target.scrollHeight
      });

      var filename = '礼品定制数据报告_' + (window.__REPORT_UPDATED_AT__ || new Date().toISOString().slice(0,10)) + '.png';

      if (canvas.toBlob){
        canvas.toBlob(function(blob){
          if (!blob){ downloadFromDataUrl(canvas.toDataURL('image/png'), filename); return; }
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url; a.download = filename;
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
          setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
        }, 'image/png');
      } else {
        downloadFromDataUrl(canvas.toDataURL('image/png'), filename);
      }
    } catch (err){
      console.error('截图失败:', err);
      alert('截图失败：' + (err && err.message ? err.message : err));
    } finally {
      hideMask();
      btn.disabled = false;
    }
  });

  function downloadFromDataUrl(dataUrl, filename){
    var a = document.createElement('a');
    a.href = dataUrl; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }
})();
</script>
